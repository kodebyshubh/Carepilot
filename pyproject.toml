[project]
name = "carepilot"
version = "0.1.0"
description = "Healthcare risk prediction (diabetes, heart disease) with a cited, abstaining RAG explainer. Demonstration prototype."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "torch>=2.4",
    "sentence-transformers>=3.1",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "groq>=0.11",
    "streamlit>=1.39",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carepilot"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs built models/index (slower)",
    "e2e: launches Streamlit and a browser",
]
addopts = "-m 'not e2e'"
